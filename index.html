<title>Kleiderb&ouml;rse H/W 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f7f5ff;padding:24px 16px;min-height:100vh;color:#2d2d2d;}
.app{max-width:820px;margin:0 auto;}
h1{font-size:22px;font-weight:700;color:#1a1a2e;letter-spacing:-0.02em;}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:28px;flex-wrap:wrap;}
.counter{background:#fff;border-radius:12px;padding:8px 16px;border:1.5px solid #e8e4f3;font-size:13px;color:#4a4080;font-weight:500;white-space:nowrap;}
.sub{font-size:13px;color:#888;margin-top:3px;}
.card{background:#fff;border-radius:14px;border:1.5px solid #e8e4f3;padding:20px 24px;margin-bottom:14px;}
.section-label{font-size:11px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px;}

/* Timeline */
.phase-row{display:flex;align-items:stretch;cursor:pointer;}
.tl-col{width:32px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.tl-dot{width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid #ccc;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:700;}
.tl-line{width:2px;flex:1;background:#e8e4f3;margin-top:2px;}
.phase-card{flex:1;margin-left:12px;margin-bottom:12px;background:#faf9fe;border:1.5px solid #e8e4f3;border-radius:12px;padding:12px 14px;transition:background .15s;}
.phase-card:hover{background:#f4f1fd;}
.phase-meta{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.phase-summary{font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:6px;}
.phase-group-line{font-size:11.5px;margin-bottom:2px;line-height:1.5;}
.phase-pct{font-size:20px;font-weight:700;line-height:1;}
.prog-mini{height:3px;background:#ece8f8;border-radius:99px;overflow:hidden;margin-top:10px;}
.prog-mini-fill{height:100%;border-radius:99px;transition:width .3s;}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.tab-btn{font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;border:1.5px solid #e8e4f3;background:#fff;color:#666;font-family:inherit;transition:all .15s;}
.tab-btn:hover{background:#f4f1fd;}

/* Detail */
.detail-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
.detail-sub{font-size:13px;color:#888;margin-bottom:18px;}
.prog-row{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.prog-pill{border-radius:12px;padding:6px 14px;font-size:13px;font-weight:600;flex-shrink:0;}
.prog-bar{flex:1;height:6px;background:#f0edf9;border-radius:99px;overflow:hidden;}
.prog-bar-fill{height:100%;border-radius:99px;transition:width .3s;}
.prog-count{font-size:12px;color:#888;white-space:nowrap;}

/* Groups */
.group-block{margin-bottom:14px;border-radius:12px;border:1.5px solid #f0edf9;overflow:hidden;}
.group-hdr{border-bottom:1.5px solid #f0edf9;padding:9px 12px;display:flex;align-items:center;gap:8px;}
.group-title-inp{border:none;background:transparent;font-size:11px;font-weight:700;letter-spacing:.07em;outline:none;font-family:inherit;padding:1px 0;flex-shrink:0;width:170px;}
.group-sep{opacity:.4;flex-shrink:0;}
.group-bullet-inp{flex:1;border:none;background:transparent;font-size:12px;color:#555;outline:none;font-family:inherit;line-height:1.5;padding:1px 0;}
.group-bullet-inp:focus{color:#1a1a2e;}
.group-rm{background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;padding:0 2px;flex-shrink:0;line-height:1;}
.todos-area{padding:8px 8px 10px;}

/* Todo rows */
.todo-row{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;margin-bottom:2px;transition:background .15s;position:relative;}
.todo-row:hover{background:#faf9fe;}
.todo-row.done-row{background:#f4f1fd;}
.checkbox{width:18px;height:18px;border-radius:5px;border:2px solid #ccc;background:#fff;flex-shrink:0;margin-top:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:11px;color:#fff;font-weight:700;user-select:none;}
.todo-content{flex:1;min-width:0;}
.todo-text-span{font-size:13.5px;color:#2d2d2d;line-height:1.5;cursor:text;display:block;word-break:break-word;}
.todo-text-span.done{color:#aaa;text-decoration:line-through;}
.todo-text-inp{width:100%;border:none;border-bottom:1.5px solid #ccc;background:transparent;font-size:13.5px;color:#2d2d2d;outline:none;font-family:inherit;padding:1px 2px;}
.owner-pill{display:inline-block;margin-top:4px;font-size:11px;border-radius:20px;padding:2px 9px;cursor:pointer;font-weight:500;}
.owner-pill:hover{opacity:.75;}
.owner-pill.empty{color:#ccc;background:#f5f5f5;font-style:italic;}
.owner-inp{border:none;border-bottom:1.5px solid #ccc;background:transparent;font-size:11px;outline:none;font-family:inherit;padding:1px 3px;margin-top:4px;width:150px;}
.todo-btns{display:none;gap:2px;flex-shrink:0;margin-top:2px;}
.todo-row:hover .todo-btns{display:flex;}
.todo-btn{background:none;border:none;cursor:pointer;color:#bbb;font-size:13px;padding:0 3px;line-height:1;}
.todo-btn.del{font-size:16px;}

/* Buttons */
.add-todo-btn{margin-top:5px;margin-left:2px;font-size:12px;background:none;border-style:dashed;border-width:1.5px;border-radius:8px;padding:4px 12px;cursor:pointer;font-family:inherit;}
.add-group-btn{width:100%;font-size:12px;color:#aaa;background:none;border:1.5px dashed #ddd;border-radius:10px;padding:7px 16px;cursor:pointer;font-family:inherit;margin-bottom:18px;display:block;}
.add-row-btn{margin-top:8px;font-size:12px;color:#6C5CE7;background:none;border:1.5px dashed #c4b8f5;border-radius:8px;padding:5px 14px;cursor:pointer;font-family:inherit;}

/* Table */
.tbl-wrap{margin-top:24px;}
.tbl-title{font-weight:600;font-size:14px;color:#1a1a2e;margin-bottom:3px;}
.tbl-sub{font-size:12px;color:#888;margin-bottom:8px;}
.tbl-scroll{overflow-x:auto;border-radius:10px;border:1.5px solid #e8e4f3;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:8px 12px;text-align:left;font-weight:600;color:#4a4080;font-size:12px;border-bottom:1.5px solid #e8e4f3;background:#f4f1fd;white-space:nowrap;}
td{padding:5px 8px;border-bottom:1px solid #f0edf9;vertical-align:middle;}
tr:nth-child(even) td{background:#faf9fe;}
td input{width:100%;border:none;background:transparent;font-size:13px;color:#2d2d2d;outline:none;font-family:inherit;padding:2px 4px;}
td input:focus{background:#f0edfc;border-radius:4px;}
td.cat{font-size:11px;font-weight:600;color:#6C5CE7;white-space:nowrap;width:120px;}
td.cat-repeat{width:120px;}

/* Doc */
.doc-section{margin-top:24px;}
.doc-label{font-size:11px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.doc-ta{width:100%;min-height:110px;border:1.5px solid #e8e4f3;border-radius:10px;padding:12px 14px;font-size:13px;color:#2d2d2d;font-family:inherit;line-height:1.6;resize:vertical;outline:none;background:#faf9fe;transition:border-color .15s;}

.footer-note{margin-top:16px;text-align:center;font-size:11px;color:#ccc;}
</style>

// \u2500\u2500 State \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const S = { view:"overview", activeId:null, todos:{}, groups:{}, notes:{}, tableRows:{} };

PHASES.forEach(p => {
  S.notes[p.id] = "";
  S.groups[p.id] = p.groups.map(g => ({ ...g, todos: g.todos.map(t => ({ ...t, done: false })) }));
  if (p.table) S.tableRows[p.id] = p.table.rows.map(r => [...r]);
  p.groups.forEach(g => g.todos.forEach(t => { S.todos[t.id] = false; }));
});

// \u2500\u2500 Helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function cleanBullet(b) { return b.replace(/\s*\([^)]*\)/g,"").replace(/\s*\u2192\s*\S+/g,"").replace(/\s*\u00b7\s*\u00b7/g," \u00b7").replace(/^\s*\u00b7\s*/g,"").trim(); }
function getTodos(pid) { return S.groups[pid].flatMap(g => g.todos); }
function getProgress(pid) { const all = getTodos(pid); const done = all.filter(t => S.todos[t.id]).length; return { done, total: all.length, pct: all.length ? Math.round(done/all.length*100) : 0 }; }
function globalProg() { let d=0,t=0; PHASES.forEach(p => { const pr=getProgress(p.id); d+=pr.done; t+=pr.total; }); return {done:d,total:t}; }
function updateCounter() { const g=globalProg(); document.getElementById("global-counter").textContent=g.done+"/"+g.total+" Aufgaben erledigt"; }

// \u2500\u2500 Render Overview \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function renderOverview() {
  updateCounter();
  let html = '<div class="card"><div class="section-label">Zeitleiste</div>';
  PHASES.forEach((phase, idx) => {
    const pr = getProgress(phase.id);
    const isLast = idx === PHASES.length - 1;
    html += `<div class="phase-row" onclick="openPhase('${phase.id}')">
      <div class="tl-col">
        <div class="tl-dot" style="border-color:${phase.color};background:${pr.pct===100?phase.color:'#fff'}">${pr.pct===100?'\u2713':''}</div>
        ${!isLast?'<div class="tl-line"></div>':''}
      </div>
      <div class="phase-card" style="border-left:3px solid ${phase.color};${isLast?'margin-bottom:0':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div style="flex:1">
            <div class="phase-meta">
              <span style="font-size:12px;font-weight:600;color:${phase.color}">${phase.label}</span>
              <span style="color:#aaa;font-size:11px">\u00b7</span>
              <span style="font-size:12px;color:#888">${phase.date}</span>
            </div>
            <div class="phase-summary">${phase.summary}</div>
            <div>`;
    S.groups[phase.id].forEach(g => {
      html += `<div class="phase-group-line"><span style="font-weight:700;color:${phase.color}">${esc(g.title)}</span>`;
      if (g.bullet) html += ` <span style="color:#888">\u00b7 ${esc(cleanBullet(g.bullet))}</span>`;
      html += `</div>`;
    });
    html += `</div></div>
          <div style="text-align:right;flex-shrink:0;min-width:52px">
            <div class="phase-pct" style="color:${pr.pct===100?phase.color:'#ccc'}">${pr.pct}%</div>
            <div style="font-size:10px;color:#aaa;margin-top:2px">${pr.done}/${pr.total}</div>
            <div style="margin-top:6px;font-size:11px;color:${phase.color};font-weight:500">Details \u2192</div>
          </div>
        </div>
        <div class="prog-mini"><div class="prog-mini-fill" style="width:${pr.pct}%;background:${phase.color}"></div></div>
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById("app").innerHTML = html;
}

// \u2500\u2500 Render Todo Row \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function renderTodoRow(pid, gi, ti, todo, color) {
  const done = S.todos[todo.id];
  const pillStyle = done ? `color:#bbb;background:#f0edf9` : `color:${color};background:${color}18`;
  return `<div class="todo-row ${done?'done-row':''}" id="tr-${esc(todo.id)}" style="background:${done?'#f4f1fd':'transparent'}">
    <div class="checkbox" style="border-color:${done?color:'#ccc'};background:${done?color:'#fff'}"
      onclick="toggleTodo('${pid}',${gi},${ti},'${esc(todo.id)}')">${done?'\u2713':''}</div>
    <div class="todo-content">
      <span class="todo-text-span ${done?'done':''}" ondblclick="editText('${pid}',${gi},${ti},'${esc(todo.id)}')">${esc(todo.text)}</span>
      ${todo.owner
        ? `<span class="owner-pill" style="${pillStyle}" onclick="editOwner('${pid}',${gi},${ti},'${esc(todo.id)}')" title="Klick zum Bearbeiten">${esc(todo.owner)}</span>`
        : `<span class="owner-pill empty" onclick="editOwner('${pid}',${gi},${ti},'${esc(todo.id)}')" title="Owner hinzuf\u00fcgen">+ Owner</span>`}
    </div>
    <div class="todo-btns">
      <button class="todo-btn" onclick="editText('${pid}',${gi},${ti},'${esc(todo.id)}')" title="Bearbeiten">\u270e</button>
      <button class="todo-btn del" onclick="deleteTodo('${pid}',${gi},${ti})" title="L\u00f6schen">\u00d7</button>
    </div>
  </div>`;
}

// \u2500\u2500 Render Detail \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function renderDetail(pid) {
  const phase = PHASES.find(p => p.id === pid);
  const pr = getProgress(pid);
  updateCounter();

  let tabs = `<div class="tabs"><button class="tab-btn" onclick="openOverview()">\u2190 \u00dcbersicht</button>`;
  PHASES.forEach(p => {
    const ppr = getProgress(p.id);
    const active = p.id === pid;
    tabs += `<button class="tab-btn" onclick="openPhase('${p.id}')"
      style="${active?`border-color:${p.color};background:${p.color}18;color:${p.color};font-weight:600`:''}">
      ${p.label} <span style="font-size:10px;opacity:.7">${ppr.done}/${ppr.total}</span></button>`;
  });
  tabs += `</div>`;

  let html = tabs + `<div class="card" style="border-top:3px solid ${phase.color};border-color:${phase.color}55">
    <div class="detail-title">${phase.label}</div>
    <div class="detail-sub">${phase.summary}</div>
    <div class="prog-row">
      <div class="prog-pill" style="background:${phase.color}22;color:${phase.color}">${phase.date}</div>
      <div class="prog-bar"><div class="prog-bar-fill" id="prog-fill" style="width:${pr.pct}%;background:${phase.color}"></div></div>
      <div class="prog-count">${pr.done}/${pr.total} erledigt</div>
    </div>`;

  S.groups[pid].forEach((group, gi) => {
    html += `<div class="group-block">
      <div class="group-hdr" style="background:${phase.color}12">
        <input class="group-title-inp" style="color:${phase.color}" value="${esc(group.title)}"
          onchange="S.groups['${pid}'][${gi}].title=this.value.toUpperCase()">
        <span class="group-sep" style="color:${phase.color}">\u00b7</span>
        <input class="group-bullet-inp" value="${esc(group.bullet)}" placeholder="Agenda-Beschreibung\u2026"
          onchange="S.groups['${pid}'][${gi}].bullet=this.value">
        <button class="group-rm" onclick="removeGroup('${pid}',${gi})">\u00d7</button>
      </div>
      <div class="todos-area" id="todos-${pid}-${gi}">`;
    group.todos.forEach((todo, ti) => { html += renderTodoRow(pid, gi, ti, todo, phase.color); });
    html += `<button class="add-todo-btn" style="color:${phase.color};border-color:${phase.color}55"
        onclick="addTodo('${pid}',${gi})">+ Aufgabe</button>
      </div></div>`;
  });

  html += `<button class="add-group-btn" onclick="addGroup('${pid}')">+ Agenda-Thema hinzuf\u00fcgen</button>`;

  // Table
  const phaseDef = PHASES.find(p => p.id === pid);
  if (phaseDef.table) {
    const rows = S.tableRows[pid] || [];
    const hasCategory = phaseDef.table.cols[0] === "Kategorie";
    html += `<div class="tbl-wrap"><div class="tbl-title">${phaseDef.table.title}</div>
      <div class="tbl-sub">${phaseDef.table.sub}</div>
      <div class="tbl-scroll"><table><thead><tr>`;
    phaseDef.table.cols.forEach(c => { html += `<th>${esc(c)}</th>`; });
    html += `</tr></thead><tbody>`;
    rows.forEach((row, ri) => {
      html += `<tr>`;
      row.forEach((cell, ci) => {
        const isCat = hasCategory && ci === 0;
        const sameAsPrev = isCat && ri > 0 && rows[ri][0] === rows[ri-1][0];
        if (isCat && sameAsPrev) {
          html += `<td class="cat-repeat"><span style="color:#ddd">\u21b3</span></td>`;
        } else {
          html += `<td ${isCat?'class="cat"':''}><input value="${esc(cell)}"
            style="${isCat?'color:#6C5CE7;font-weight:600;font-size:11px':''}"
            onchange="S.tableRows['${pid}'][${ri}][${ci}]=this.value"></td>`;
        }
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>
      <button class="add-row-btn" onclick="addTableRow('${pid}')">+ Zeile hinzuf\u00fcgen</button></div>`;
  }

  // Documentation
  html += `<div class="doc-section">
    <div class="doc-label">Dokumentation</div>
    <textarea class="doc-ta" placeholder="Beschl\u00fcsse, Notizen, offene Punkte aus diesem Treffen\u2026"
      onfocus="this.style.borderColor='${phase.color}'" onblur="this.style.borderColor='#e8e4f3'"
      onchange="S.notes['${pid}']=this.value">${esc(S.notes[pid])}</textarea>
  </div></div>`;

  document.getElementById("app").innerHTML = html;
}

// \u2500\u2500 Actions \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function openOverview() { S.view="overview"; S.activeId=null; renderOverview(); }
function openPhase(pid) { S.view="detail"; S.activeId=pid; renderDetail(pid); }

function toggleTodo(pid, gi, ti, tid) {
  S.todos[tid] = !S.todos[tid];
  const todo = S.groups[pid][gi].todos[ti];
  const color = PHASES.find(p=>p.id===pid).color;
  const row = document.getElementById("tr-"+tid);
  if (row) row.outerHTML = renderTodoRow(pid, gi, ti, todo, color);
  updateCounter();
  const pr = getProgress(pid);
  const fill = document.getElementById("prog-fill");
  if (fill) fill.style.width = pr.pct + "%";
  const cnt = document.querySelector(".prog-count");
  if (cnt) cnt.textContent = pr.done+"/"+pr.total+" erledigt";
}

function editText(pid, gi, ti, tid) {
  const todo = S.groups[pid][gi].todos[ti];
  const row = document.getElementById("tr-"+tid);
  if (!row) return;
  const span = row.querySelector(".todo-text-span");
  const color = PHASES.find(p=>p.id===pid).color;
  const inp = document.createElement("input");
  inp.className = "todo-text-inp";
  inp.style.borderBottomColor = color;
  inp.value = todo.text;
  span.replaceWith(inp);
  inp.focus();
  const commit = () => { todo.text = inp.value; renderDetail(pid); };
  inp.onblur = commit;
  inp.onkeydown = e => { if (e.key==="Enter"||e.key==="Escape") commit(); };
}

function editOwner(pid, gi, ti, tid) {
  const todo = S.groups[pid][gi].todos[ti];
  const row = document.getElementById("tr-"+tid);
  if (!row) return;
  const pill = row.querySelector(".owner-pill");
  const color = PHASES.find(p=>p.id===pid).color;
  const inp = document.createElement("input");
  inp.className = "owner-inp";
  inp.style.borderBottomColor = color;
  inp.value = todo.owner || "";
  inp.placeholder = "Owner eingeben\u2026";
  pill.replaceWith(inp);
  inp.focus();
  const commit = () => { todo.owner = inp.value; renderDetail(pid); };
  inp.onblur = commit;
  inp.onkeydown = e => { if (e.key==="Enter"||e.key==="Escape") commit(); };
}

function deleteTodo(pid, gi, ti) {
  const todo = S.groups[pid][gi].todos[ti];
  delete S.todos[todo.id];
  S.groups[pid][gi].todos.splice(ti, 1);
  renderDetail(pid);
}

function addTodo(pid, gi) {
  const id = "t_" + Date.now();
  S.todos[id] = false;
  S.groups[pid][gi].todos.push({ id, text: "", owner: "" });
  renderDetail(pid);
  setTimeout(() => {
    const todos = S.groups[pid][gi].todos;
    editText(pid, gi, todos.length-1, todos[todos.length-1].id);
  }, 30);
}

function removeGroup(pid, gi) {
  S.groups[pid][gi].todos.forEach(t => delete S.todos[t.id]);
  S.groups[pid].splice(gi, 1);
  renderDetail(pid);
}

function addGroup(pid) {
  S.groups[pid].push({ id:"g_"+Date.now(), title:"NEUES THEMA", bullet:"", todos:[] });
  renderDetail(pid);
}

function addTableRow(pid) {
  const phase = PHASES.find(p=>p.id===pid);
  S.tableRows[pid].push(phase.table.cols.map(()=>""));
  renderDetail(pid);
}

// \u2500\u2500 Init \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
renderOverview();
</script>
